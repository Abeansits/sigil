---
name: PR Review by OpenHands

# Label-gated. Add the 'review-this' label to a PR to trigger a Cloud-backed
# OpenHands agent review. Agent runs in OpenHands Cloud infrastructure (not
# in this runner) and posts comments to the PR via its own GitHub OAuth
# integration (authorized at app.all-hands.dev for this repo).
on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  trigger-review:
    if: github.event.label.name == 'review-this'
    runs-on: ubuntu-24.04
    steps:
      - name: Start OpenHands Cloud conversation
        env:
          OH_API_KEY: ${{ secrets.API_KEY_OPENHANDS }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          read -r -d '' INSTRUCTION <<EOF || true
          Review pull request #${PR_NUMBER} ("${PR_TITLE}") on ${REPO}.
          URL: ${PR_URL}

          ## Task
          Perform a thorough code review:
          - Read the full diff and relevant surrounding context.
          - Identify bugs, logic errors, security issues, unsafe assumptions,
            missing error handling, and violations of the repo's CLAUDE.md /
            AGENTS.md conventions.
          - For each specific line-level issue, post an INLINE review
            comment anchored to the exact file + line. Use gh CLI inside
            your sandbox:
              gh pr review ${PR_NUMBER} --repo ${REPO} \\
                --comment \\
                --body "summary here"
            For inline line comments, use \`gh api\` against
            /repos/${REPO}/pulls/${PR_NUMBER}/comments with path, line,
            side, and body. One POST per inline comment.
          - After inline comments are posted, submit a STRUCTURED REVIEW
            with an explicit verdict (APPROVE / REQUEST_CHANGES / COMMENT):
              gh pr review ${PR_NUMBER} --repo ${REPO} \\
                --approve|--request-changes|--comment \\
                --body "<FULL STRUCTURED ANALYSIS HERE>"
            The review body must contain your full analysis verbatim — do
            NOT condense to a one-paragraph summary. Include the same
            section headings you'd use internally (Bugs, Security,
            Conventions, Best Practices, Verdict).

          ## Output formatting
          - Prefix every comment and review body with the marker
            "🤖 **OpenHands review** — " so it's distinguishable from
            human-written comments by the repo owner (you are OAuthed
            as the owner's account).

          ## Rules
          - Do NOT push commits or modify files in the repo. Review only.
          - Do NOT merge, close, or re-open the PR.
          EOF

          jq -n \
            --arg repo "${REPO}" \
            --arg msg "${INSTRUCTION}" \
            '{
              selected_repository: $repo,
              initial_message: {
                content: [{type: "text", text: $msg}]
              }
            }' \
            > payload.json

          curl -sS --fail-with-body \
            -X POST https://app.all-hands.dev/api/v1/app-conversations \
            -H "Authorization: Bearer ${OH_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @payload.json
