[package]
name = "sigil-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "sigil"
path = "src/main.rs"

[features]
container = ["sigil-runtime/container"]

[dependencies]
sigil-core = { path = "../sigil-core" }
sigil-audit = { path = "../sigil-audit" }
sigil-policy = { path = "../sigil-policy" }
sigil-store = { path = "../sigil-store" }
sigil-runtime = { path = "../sigil-runtime" }
sigil-conductor = { path = "../sigil-conductor" }
sigil-memory = { path = "../sigil-memory" }
sigil-bridge = { path = "../sigil-bridge" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
time.workspace = true
secrecy.workspace = true
tokio-util.workspace = true

[dev-dependencies]
sigil-core = { path = "../sigil-core" }
sigil-conductor = { path = "../sigil-conductor" }
sigil-policy = { path = "../sigil-policy" }
sigil-audit = { path = "../sigil-audit" }
sigil-store = { path = "../sigil-store" }
sigil-bridge = { path = "../sigil-bridge" }
sigil-runtime = { path = "../sigil-runtime" }
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
assert_matches.workspace = true
serde_json.workspace = true

[lints]
workspace = true
