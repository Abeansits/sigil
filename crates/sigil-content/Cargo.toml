[package]
name = "sigil-content"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sigil-core = { path = "../sigil-core" }
sigil-policy = { path = "../sigil-policy" }
serde.workspace = true
thiserror.workspace = true
getrandom = "0.2"
regex.workspace = true
scraper = { version = "0.21", default-features = false, optional = true }
ego-tree = { version = "0.9", optional = true }

[dev-dependencies]
assert_matches.workspace = true
serde_json.workspace = true

[features]
default = ["html", "markdown", "json"]
html = ["dep:scraper", "dep:ego-tree"]
markdown = []
json = []
image = []
pdf = []

[lints]
workspace = true
