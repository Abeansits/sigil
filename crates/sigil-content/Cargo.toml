[package]
name = "sigil-content"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sigil-core = { path = "../sigil-core" }
sigil-policy = { path = "../sigil-policy" }
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
getrandom = "0.2"
regex.workspace = true
# HTML parser — html5ever + rcdom only, no CSS-selector crate. scraper
# bundles `selectors` + `cssparser`, both MPL-2.0, which clashes with
# the permissive-only deny.toml policy. We don't need selectors anyway;
# the walker is a plain DOM traversal.
html5ever = { version = "0.38", optional = true }
markup5ever_rcdom = { version = "0.38", optional = true }
pulldown-cmark = { workspace = true, optional = true }

[dev-dependencies]
assert_matches.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = ["html", "markdown", "json"]
html = ["dep:html5ever", "dep:markup5ever_rcdom"]
markdown = ["dep:pulldown-cmark"]
json = ["dep:serde_json"]
image = []
pdf = []

[lints]
workspace = true
