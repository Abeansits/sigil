[package]
name = "sigil-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
container = ["dep:sigil-audit", "dep:sigil-mcp"]

[dependencies]
sigil-core = { path = "../sigil-core" }
sigil-policy = { path = "../sigil-policy" }
sigil-audit = { path = "../sigil-audit", optional = true }
sigil-mcp = { path = "../sigil-mcp", optional = true }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["process", "fs", "sync", "time", "net", "io-util"] }
tracing.workspace = true
regex.workspace = true
time.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
assert_matches.workspace = true
tempfile.workspace = true

[lints]
workspace = true
