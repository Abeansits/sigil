# deny.toml — cargo-deny configuration for sigil
#
# Checks all workspace dependencies for:
#   - Known security advisories (RustSec)
#   - License compliance (permissive-only allowlist)
#   - Duplicate crate versions (warn, not deny)
#   - Untrusted sources (only crates.io allowed)
#
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check all targets — sigil builds on Linux (CI) and macOS (dev).
all-features = false
no-default-features = false

# ==============================================================================
# Advisories — deny crates with known security vulnerabilities
# ==============================================================================
[advisories]
# The advisory database is fetched and cached automatically.
# Advisories and yanked crates are denied by default in v0.19.
# No exceptions — if an advisory fires, we upgrade or replace the crate.
# To add a temporary exception while waiting for a fix:
ignore = [
    # DoS via stack exhaustion in RFC 2822 parsing. Fix (v0.3.47) requires Rust 1.88+,
    # but our MSRV is 1.85. Sigil only uses OffsetDateTime::now_utc(), Duration, and
    # Rfc3339 formatting — never RFC 2822 parsing with user input. Low risk.
    # Remove this exception when MSRV is bumped to >= 1.88.
    { id = "RUSTSEC-2026-0009", reason = "time v0.3.47 requires Rust 1.88+; sigil doesn't parse RFC 2822" },
]

# ==============================================================================
# Licenses — permissive-only allowlist
# ==============================================================================
[licenses]
# The confidence threshold for detecting a license from license text.
confidence-threshold = 0.8

# Permissive licenses allowed in this workspace.
# Sigil itself is MIT-licensed. All deps must use a compatible permissive license.
# Any license not in this list is denied (including copyleft: GPL, AGPL, LGPL, MPL).
# Note: r-efi is LGPL-2.1-or-later OR MIT OR Apache-2.0, so cargo-deny
# picks the MIT/Apache-2.0 option and it passes.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",              # Boost Software License (ryu)
    "ISC",                   # ring, rustls, hyper-rustls
    "Unicode-3.0",           # ICU / unicode crates
    "Unlicense",             # aho-corasick, byteorder, memchr
    "Zlib",                  # foldhash
    "CDLA-Permissive-2.0",   # webpki-roots
]

exceptions = []

[licenses.private]
# Don't check license for unpublished workspace crates.
ignore = true

# ==============================================================================
# Bans — detect duplicate crate versions
# ==============================================================================
[bans]
# Warn on multiple versions of the same crate (common in the Rust ecosystem
# due to semver-incompatible upgrades). Denying would be too noisy.
multiple-versions = "warn"
# Allow wildcard version requirements (we pin in Cargo.lock anyway).
wildcards = "allow"
# Highlight all paths to duplicate versions for easier deduplication.
highlight = "all"

# No skip list — we want to see all duplicates so we can deduplicate over time.
skip = []
skip-tree = []

# ==============================================================================
# Sources — only allow crates.io
# ==============================================================================
[sources]
# Only crates from crates.io are allowed. No git deps, no private registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
